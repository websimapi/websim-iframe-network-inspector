<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Network Inspector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Iframe Network Inspector</h1>
            <div class="controls">
                <input type="url" id="urlInput" value="https://websim.com/" placeholder="Enter URL">
                <button id="goButton">Load & Inspect</button>
            </div>
            <p class="notice">Note: This tool may not work for all websites due to security policies (e.g., CSP, X-Frame-Options).</p>
        </header>
        <main>
            <div class="iframe-container">
                <iframe id="contentFrame" title="Website Content"></iframe>
            </div>
            <div class="log-container">
                <h2>Captured GET Requests</h2>
                <pre id="fetchLog"></pre>
            </div>
        </main>
    </div>
    <script type="module" src="script.js"></script>
